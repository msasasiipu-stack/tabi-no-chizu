<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅の地図</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗾%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --land:#D8DFDB; --land-hover:#C3CDC7; --line:#FFFFFF;
  --ink:#1E2624; --muted:#6C7773; --accent:#2F4F84; --accent-ink:#FFFFFF; --accent-soft:#E2E9F4;
  --border:#E0E5E2; --danger:#A83E3E;
  --shadow:0 1px 2px rgba(20,30,26,.06),0 8px 24px rgba(20,30,26,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15191B; --surface:#1E2427; --land:#2D3639; --land-hover:#3A4548; --line:#15191B;
    --ink:#E7EBE9; --muted:#95A09B; --accent:#8DAEE0; --accent-ink:#0F1A2A; --accent-soft:#243244;
    --border:#2B3437; --danger:#E08A8A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:28px 24px 56px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:24px}
.head h1{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:600;font-size:30px;letter-spacing:.06em;margin:0;line-height:1.2}
.head .sub{margin:6px 0 0;color:var(--muted);font-size:13px}
.count{text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.count .n{font-family:"Shippori Mincho",serif;font-size:40px;font-weight:500}
.count .d{color:var(--muted);font-size:15px;margin-left:4px}
.count .l{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;margin-top:8px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
@media (max-width:840px){
  .main{grid-template-columns:1fr}
  .wrap{padding:20px 16px 48px}
  .head h1{font-size:24px}
}

.map{position:relative}
.map svg{display:block;width:100%;height:auto;max-height:82vh;margin:0 auto;overflow:visible}
.pref{fill:var(--land);stroke:var(--line);stroke-width:.55;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.pref:hover,.pref:focus-visible{fill:var(--land-hover);outline:none}
.pref.visited{fill:var(--accent)}
.pref.visited:hover,.pref.visited:focus-visible{fill:var(--accent)}
.pref.photo{fill:var(--land)}
.pref.photo:hover{opacity:.92}
.outline{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-linejoin:round;pointer-events:none}
.inset{fill:none;stroke:var(--border);stroke-width:.6}
#pins.off{display:none}
.pin{cursor:pointer}
.pin .body{transition:transform .15s;transform-box:fill-box;transform-origin:center}
.pin:hover .body,.pin.sel .body{transform:scale(1.9)}
.pin .frame{fill:#fff;stroke:rgba(0,0,0,.22);stroke-width:.4}
.pin.sel .frame{stroke:var(--accent);stroke-width:.9}
.pin .lead{stroke:var(--muted);stroke-width:.45;fill:none}
.pin .dot{fill:var(--muted)}
.tip{
  position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);
  padding:5px 9px;border-radius:4px;font-size:12px;white-space:nowrap;
  transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .1s;z-index:2;
}
.tip img{display:block;width:150px;height:112px;object-fit:cover;border-radius:3px;margin:2px 0 5px}
.tip.on{opacity:1}
.legend{display:flex;gap:18px;margin-top:12px;color:var(--muted);font-size:12px;justify-content:center;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.legend label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding-left:6px;border-left:1px solid var(--border)}
.legend input{margin:0;accent-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);position:sticky;top:20px;overflow:hidden}
@media (max-width:840px){.panel{position:static}}
.panel .inner{padding:20px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
.pname{font-family:"Shippori Mincho",serif;font-size:26px;font-weight:600;margin:4px 0 14px;letter-spacing:.04em;line-height:1.2;text-wrap:balance}
.empty{color:var(--muted);font-size:14px}
.empty p{margin:0 0 8px}
.notice{margin-top:14px;padding:10px 12px;border-radius:6px;background:var(--accent-soft);font-size:12px;color:var(--ink)}
.err{color:var(--danger);font-size:12px;margin-top:8px;min-height:1.2em}
.photo{
  position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--bg);border:1px dashed var(--border);cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;
}
.photo.has{border-style:solid}
.photo.drag{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ov{position:absolute;inset:auto 8px 8px auto;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 8px;border-radius:3px;opacity:0;transition:opacity .15s}
.photo.has:hover .ov{opacity:1}
.photo.busy::after{content:"写真を整えています…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);color:#fff;font-size:13px}
.field{margin-top:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:6px;background:var(--bg);padding:8px 10px;font-size:14px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:72px}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}
.actions .r{display:flex;gap:8px}
.btn{border:1px solid var(--border);background:transparent;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--danger);border-color:transparent}
.btn.danger:hover{border-color:var(--danger)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.saved{font-size:12px;color:var(--muted)}
.link{background:none;border:none;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:11px}

.list{margin-top:36px}
.list h2{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:500;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:var(--surface);border:1px solid var(--border);cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card .th{width:44px;height:44px;border-radius:4px;flex:none;object-fit:cover;background:var(--accent);display:block}
.card .th.blank{display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-family:"Shippori Mincho",serif;font-size:16px}
.card b{display:block;font-weight:500;font-size:14px;line-height:1.3}
.card small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}

.foot{margin-top:40px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- Supabase（合言葉つきの関数だけ呼ぶ） ---------- */
async function rpc(name, params){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method:"POST",
    headers:{ "apikey":SUPABASE_KEY, "Authorization":"Bearer "+SUPABASE_KEY, "Content-Type":"application/json" },
    body: JSON.stringify(params)
  });
  if(!r.ok){
    let msg=""; try{ msg = (await r.json()).message || ""; }catch{}
    const e = new Error(msg || ("HTTP "+r.status));
    e.code = /bad_code/.test(msg) ? "bad_code" : /too_large/.test(msg) ? "too_large" : "error";
    throw e;
  }
  const text = await r.text();
  return text ? JSON.parse(text) : null;
}
async function loadVisits(){
  const rows = await rpc("list_visits", {code});
  const next = {};
  rows.forEach(r=>{ next[r.pref] = {date:r.visit_date||"", memo:r.memo||"", thumb:r.thumb||"", hasPhoto:!!r.has_photo, updatedAt:r.updated_at}; });
  // 写真が更新されてたらキャッシュを捨てる
  Object.keys(photos).forEach(id=>{ if(!next[id] || next[id].updatedAt !== (visits[id]||{}).updatedAt) delete photos[id]; });
  visits = next;
}
async function fetchPhoto(id){
  if(photos[id]) return photos[id];
  const p = await rpc("get_photo", {code, p:id});
  if(p) photos[id] = p;
  return p;
}

  let x=0,y=0,cmd="",poly=[],best=null,bestA=0,i=0;
  const close=()=>{ if(poly.length<3){poly=[];return;} let a=0,cx=0,cy=0;
    for(let k=0;k<poly.length;k++){ const [x1,y1]=poly[k],[x2,y2]=poly[(k+1)%poly.length]; const f=x1*y2-x2*y1; a+=f; cx+=(x1+x2)*f; cy+=(y1+y2)*f; }
    a/=2; if(Math.abs(a)>bestA){ bestA=Math.abs(a); best=[cx/(6*a),cy/(6*a)]; } poly=[]; };
  while(i<t.length){
    if(/[a-zA-Z]/.test(t[i])){ cmd=t[i++]; if(cmd==="z"||cmd==="Z"){ close(); continue; } }
    const a=+t[i++], b=+t[i++];
    if(cmd==="m"){ x+=a; y+=b; cmd="l"; } else if(cmd==="M"){ x=a; y=b; cmd="L"; } else if(cmd==="l"){ x+=a; y+=b; } else { x=a; y=b; }
    poly.push([x,y]);
  }
  close();
  anchor[p.id] = best || [bbox[p.id].x+bbox[p.id].w/2, bbox[p.id].y+bbox[p.id].h/2];
});

const tip = $("tip");
function hitId(e){ const t = e.target.closest(".pref, .pin"); return t ? t.dataset.id : null; }
svg.addEventListener("mousemove", e=>{
  const id = hitId(e); if(!id){tip.classList.remove("on");return;}
  const p = BY_ID[id], v = visits[id];
  const label = v ? `${p.name}${v.date?"・"+fmtDate(v.date):""}` : p.name;
  tip.innerHTML = (v && v.thumb ? `<img src="${v.thumb}" alt="">` : "") + esc(label);
  const r = mapEl.getBoundingClientRect();
  tip.style.left = (e.clientX - r.left) + "px";
  tip.style.top = (e.clientY - r.top) + "px";
  tip.classList.add("on");
});
svg.addEventListener("mouseleave", ()=>tip.classList.remove("on"));
svg.addEventListener("mouseover", e=>{ const g=e.target.closest(".pin"); if(g) g.parentNode.appendChild(g); });
svg.addEventListener("click", e=>{ const id=hitId(e); if(id) select(id); });
svg.addEventListener("keydown", e=>{ const id=hitId(e); if(id && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); select(id);} });

const pinToggle = $("pinToggle");
try{ pinToggle.checked = localStorage.getItem("tabi-pins") !== "off"; }catch{}
$("pins").classList.toggle("off", !pinToggle.checked);
pinToggle.addEventListener("change", ()=>{
  $("pins").classList.toggle("off", !pinToggle.checked);
  try{ localStorage.setItem("tabi-pins", pinToggle.checked ? "on" : "off"); }catch{}
});

function select(id){
  selected = id;
  renderAll();
  if(window.innerWidth<=840) $("panel").scrollIntoView({behavior:"smooth",block:"start"});
  const v = visits[id];
  if(v && v.hasPhoto && !photos[id] && code){
    fetchPhoto(id).then(()=>{ if(selected===id) renderPanel(); }).catch(()=>{});
  }
}

const patternHref = {};
function renderMap(){
  const defs = $("defs");
  PREFS.forEach(p=>{
    const el = $("p-"+p.id), v = visits[p.id];
    el.classList.toggle("visited", !!v);
    el.classList.toggle("photo", !!(v && v.thumb));
    if(v && v.thumb){
      let pat = $("ph-"+p.id);
      if(!pat){
        const b = bbox[p.id];
        pat = document.createElementNS("http://www.w3.org/2000/svg","pattern");
        pat.id = "ph-"+p.id;
        pat.setAttribute("patternUnits","userSpaceOnUse");
        pat.setAttribute("x",b.x); pat.setAttribute("y",b.y);
        pat.setAttribute("width",b.w); pat.setAttribute("height",b.h);
        const img = document.createElementNS("http://www.w3.org/2000/svg","image");
        img.setAttribute("width",b.w); img.setAttribute("height",b.h);
        img.setAttribute("preserveAspectRatio","xMidYMid slice");
        pat.appendChild(img); defs.appendChild(pat);
      }
      if(patternHref[p.id] !== v.thumb){ pat.firstChild.setAttribute("href", v.thumb); patternHref[p.id] = v.thumb; }
      el.style.fill = `url(#ph-${p.id})`;
    }else{
      el.style.fill = "";
      const pat = $("ph-"+p.id); if(pat){ pat.remove(); delete patternHref[p.id]; }
    }
  });
  const o = $("outline");
  if(selected){ o.setAttribute("d", PATHS[selected]); o.hidden=false; } else o.hidden=true;
  $("cnt").textContent = Object.keys(visits).length;
  renderPins();
}

/* 写真ピン：本土の重心に写真の札を立てる。密集地は互いに押しのけて重なりを避ける */
const PIN = 30, PAD = 2;
const pinEls = {};
function renderPins(){
  const g = $("pins");
  const ids = PREFS.filter(p=>visits[p.id] && visits[p.id].thumb).map(p=>p.id);
  Object.keys(pinEls).forEach(id=>{ if(!ids.includes(id)){ pinEls[id].remove(); delete pinEls[id]; } });
  const pos = ids.map(id=>({id, x:anchor[id][0], y:anchor[id][1]}));
  const MIN = PIN + 3;
  for(let it=0; it<80; it++){
    let moved=false;
    for(let a=0;a<pos.length;a++) for(let b=a+1;b<pos.length;b++){
      const A=pos[a], B=pos[b]; let dx=B.x-A.x, dy=B.y-A.y; let d=Math.hypot(dx,dy);
      if(d<MIN){ if(d<0.01){ dx=1; dy=0; d=1; } const push=(MIN-d)/2; A.x-=dx/d*push; A.y-=dy/d*push; B.x+=dx/d*push; B.y+=dy/d*push; moved=true; }
    }
    pos.forEach(P=>{ P.x=Math.min(438-PIN/2, Math.max(PIN/2, P.x)); P.y=Math.min(516-PIN/2, Math.max(PIN/2, P.y)); });
    if(!moved) break;
  }
  pos.forEach(P=>{
    const [ax,ay] = anchor[P.id];
    let el = pinEls[P.id];
    if(!el){
      el = document.createElementNS("http://www.w3.org/2000/svg","g");
      el.setAttribute("class","pin"); el.dataset.id = P.id;
      el.innerHTML = `<line class="lead"/><circle class="dot" r="1.2"/>
        <g class="place"><g class="body">
          <rect class="frame" x="${-PIN/2}" y="${-PIN/2}" width="${PIN}" height="${PIN}" rx="2.5"/>
          <clipPath id="clip-${P.id}"><rect x="${-PIN/2+PAD}" y="${-PIN/2+PAD}" width="${PIN-PAD*2}" height="${PIN-PAD*2}" rx="1.5"/></clipPath>
          <image x="${-PIN/2+PAD}" y="${-PIN/2+PAD}" width="${PIN-PAD*2}" height="${PIN-PAD*2}" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-${P.id})"/>
          <title>${BY_ID[P.id].name}</title>
        </g></g>`;
      g.appendChild(el); pinEls[P.id] = el;
    }
    const img = el.querySelector("image");
    if(img.getAttribute("href") !== visits[P.id].thumb) img.setAttribute("href", visits[P.id].thumb);
    const line = el.querySelector(".lead"), dot = el.querySelector(".dot");
    const far = Math.hypot(P.x-ax, P.y-ay) > PIN/2;
    line.setAttribute("x1",ax); line.setAttribute("y1",ay); line.setAttribute("x2",P.x); line.setAttribute("y2",P.y);
    line.style.display = far ? "" : "none";
    dot.setAttribute("cx",ax); dot.setAttribute("cy",ay); dot.style.display = far ? "" : "none";
    el.querySelector(".place").setAttribute("transform", `translate(${P.x},${P.y})`);
    el.classList.toggle("sel", P.id===selected);
  });
  const selEl = pinEls[selected]; if(selEl) g.appendChild(selEl);
}

/* ---------- パネル ---------- */
function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ if(!d) return ""; const [y,m,dd]=d.split("-"); return `${y}年${+m}月${+dd}日`; }
function current(id){ return Object.assign({}, visits[id]||{}, drafts[id]||{}); }
function isDirty(id){ return !!drafts[id] && Object.keys(drafts[id]).length>0; }
function panelPhoto(id){ const d=drafts[id]||{}; if(d.photo) return d.photo; if(photos[id]) return photos[id]; const v=visits[id]; return v ? v.thumb : ""; }

function renderLogin(msg){
  $("panelInner").innerHTML = `<div class="eyebrow"><span>ようこそ</span></div>
    <p class="pname">合言葉を入力</p>
    <div class="empty"><p>この地図は家族用です。合言葉を入れると、写真や記録が見られて、追加もできます。</p></div>
    <div class="field"><label for="codeIn">合言葉</label><input type="password" id="codeIn" autocomplete="current-password" placeholder="tabi-……"></div>
    <div class="err" id="codeErr">${esc(msg||"")}</div>
    <div class="actions"><span></span><button class="btn primary" id="codeGo">ひらく</button></div>`;
  const go = async ()=>{
    const c = $("codeIn").value.trim(); if(!c) return;
    $("codeGo").disabled = true; $("codeGo").textContent = "確認中…";
    try{
      code = c; await loadVisits();
      try{ localStorage.setItem("tabi-code", c); }catch{}
      setStatus("保存先: クラウド（同じ合言葉の人には同じ地図が見えます）");
      renderAll(); startAutoRefresh();
    }catch(e){
      code = null;
      renderLogin(e.code==="bad_code" ? "合言葉が違います" : "つながりませんでした。少し待ってからもう一度お試しください");
    }
  };
  $("codeGo").addEventListener("click", go);
  $("codeIn").addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
  $("codeIn").focus();
}

let panelFor = null;
function renderPanel(){
  if(!code){ renderLogin(); return; }
  const box = $("panelInner");
  const active = document.activeElement;
  if(selected && panelFor===selected && active && box.contains(active) && (active.id==="memo"||active.id==="date")) return; // 入力中は触らない
  panelFor = selected;
  if(!selected){
    box.innerHTML = `<div class="eyebrow"><span>はじめかた</span></div>
      <p class="pname">都道府県を選ぶ</p>
      <div class="empty">
        <p>地図の都道府県をタップすると、そこで撮った写真と日付、ひとことメモを残せます。</p>
        <p>保存するとすぐ、同じ合言葉で開いている人の地図にも反映されます。</p>
      </div>`;
    return;
  }
  const p = BY_ID[selected], v = current(selected), dirty = isDirty(selected), exists = !!visits[selected];
  const ph = panelPhoto(selected);
  box.innerHTML = `
    <div class="eyebrow"><span>${p.region}${p.region==="北海道"||p.region==="沖縄"?"":"地方"}</span><span>No.${String(p.code).padStart(2,"0")}</span></div>
    <p class="pname">${p.name}</p>
    <div class="photo ${ph?"has":""}" id="photoBox" role="button" tabindex="0" aria-label="写真を選ぶ">
      ${ph ? `<img src="${ph}" alt="${p.name}で撮った写真"><span class="ov">写真を差し替える</span>` : `<span>写真を選ぶ<br><small>タップ、またはここにドロップ</small></span>`}
    </div>
    <div class="field"><label for="date">行った日</label><input type="date" id="date" value="${esc(v.date)}"></div>
    <div class="field"><label for="memo">ひとこと</label><textarea id="memo" placeholder="食べたもの、泊まった宿、天気など">${esc(v.memo)}</textarea></div>
    <div class="actions">
      <span class="saved" id="savedTxt">${dirty ? "未保存の変更があります" : exists && v.updatedAt ? "保存済み "+new Date(v.updatedAt).toLocaleDateString("ja-JP") : "まだ記録がありません"}</span>
      <span class="r">
        ${exists ? `<button class="btn danger" id="del">記録を消す</button>` : ""}
        <button class="btn primary" id="save" ${dirty||!exists ? "" : "disabled"}>${exists ? "保存する" : "行ったことにする"}</button>
      </span></div>`;

  const pb = $("photoBox");
  pb.addEventListener("click", ()=>$("file").click());
  pb.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("file").click(); } });
  ["dragenter","dragover"].forEach(ev=>pb.addEventListener(ev, e=>{ e.preventDefault(); pb.classList.add("drag"); }));
  ["dragleave","drop"].forEach(ev=>pb.addEventListener(ev, e=>{ e.preventDefault(); pb.classList.remove("drag"); }));
  pb.addEventListener("drop", e=>{ const f=e.dataTransfer.files[0]; if(f) handlePhoto(f); });
  $("date").addEventListener("change", e=> setDraft(selected, {date:e.target.value}));
  $("memo").addEventListener("input", e=> setDraft(selected, {memo:e.target.value}, true));
  $("save").addEventListener("click", ()=> saveSelected());
  const del = $("del"); if(del) del.addEventListener("click", ()=>{
    if(confirm(`${p.name}の記録（写真・日付・メモ）を消します。よろしいですか？`)) removeVisit(selected);
  });
}
function setDraft(id, patch, quiet){
  drafts[id] = Object.assign({}, drafts[id]||{}, patch);
  if(quiet){ const b=$("save"); if(b) b.disabled=false; const s=$("savedTxt"); if(s) s.textContent="未保存の変更があります"; }
  else { panelFor = null; renderPanel(); }
}

$("file").addEventListener("change", e=>{ const f=e.target.files[0]; if(f) handlePhoto(f); e.target.value=""; });

async function handlePhoto(file){
  if(!selected) return;
  if(!file.type.startsWith("image/")){ toast("画像ファイルを選んでください"); return; }
  const id = selected;
  const pb = $("photoBox"); if(pb) pb.classList.add("busy");
  try{
    const src = await loadBitmap(file);
    const photo = compress(src, 1200, PHOTO_LIMIT);
    const thumb = compress(src, 260, THUMB_LIMIT);
    setDraft(id, {photo, thumb});
    toast("写真を選びました。「保存する」で地図にはめ込みます");
  }catch(err){
    console.error(err); toast("写真を読み込めませんでした。別の画像で試してください");
    if(pb) pb.classList.remove("busy");
  }
}
async function loadBitmap(file){
  try{ return await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch{ return await new Promise((ok,ng)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ng; i.src=URL.createObjectURL(file); }); }
}
function compress(src, maxSide, limit){
  const W = src.width||src.naturalWidth, H = src.height||src.naturalHeight;
  let max = maxSide;
  for(;;){
    const s = Math.min(1, max/Math.max(W,H));
    const c = document.createElement("canvas");
    c.width = Math.max(1,Math.round(W*s)); c.height = Math.max(1,Math.round(H*s));
    c.getContext("2d").drawImage(src,0,0,c.width,c.height);
    for(const q of [0.84,0.74,0.64,0.54]){ const u = c.toDataURL("image/jpeg",q); if(u.length < limit) return u; }
    if(max <= 160) return c.toDataURL("image/jpeg",0.5);
    max = Math.round(max*0.75);
  }
}

/* ---------- 一覧 ---------- */
function renderList(){
  const ids = PREFS.filter(p=>visits[p.id]).map(p=>p.id);
  $("list").hidden = ids.length===0;
  $("listCnt").textContent = ids.length ? `${ids.length}か所` : "";
  $("grid").innerHTML = ids.map(id=>{
    const p=BY_ID[id], v=visits[id];
    return `<button class="card ${id===selected?"sel":""}" data-id="${id}">
      ${v.thumb ? `<img class="th" src="${v.thumb}" alt="">` : `<span class="th blank">${p.short[0]}</span>`}
      <span><b>${p.name}</b><small>${v.date?fmtDate(v.date):"日付なし"}</small></span></button>`;
  }).join("");
  $("grid").querySelectorAll(".card").forEach(b=>b.addEventListener("click", ()=>{ select(b.dataset.id); window.scrollTo({top:0,behavior:"smooth"}); }));
}
function renderAll(){ renderMap(); renderPanel(); renderList(); }

/* ---------- 保存 ---------- */
function setStatus(t){ $("status").innerHTML = esc(t) + (code ? ' <button class="link" id="forget">合言葉を忘れる</button>' : ""); const f=$("forget"); if(f) f.addEventListener("click", ()=>{ try{ localStorage.removeItem("tabi-code"); }catch{} location.reload(); }); }
let toastTimer;
function toast(msg, long){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"), long?5000:2600); }

async function saveSelected(){
  const id = selected; if(!id || !code) return;
  const cur = current(id), d = drafts[id]||{};
  const b = $("save"); if(b){ b.disabled = true; b.textContent = "保存しています…"; }
  try{
    await rpc("save_visit", { code, p:id, d:cur.date||"", m:cur.memo||"", t:d.thumb||null, ph:d.photo||null, keep_photo: !d.photo });
    if(d.photo) photos[id] = d.photo;
    delete drafts[id];
    await loadVisits();
    panelFor = null; renderAll();
    toast(`${BY_ID[id].name}を保存しました`);
  }catch(e){
    console.error(e);
    if(e.code==="bad_code"){ code=null; try{ localStorage.removeItem("tabi-code"); }catch{} renderLogin("合言葉が変わったようです。もう一度入力してください"); return; }
    toast(e.code==="too_large" ? "写真が大きすぎて保存できませんでした" : "保存できませんでした。電波の良いところでもう一度お試しください", true);
    if(b){ b.disabled=false; b.textContent="保存する"; }
  }
}
async function removeVisit(id){
  try{
    await rpc("delete_visit", {code, p:id});
    delete drafts[id]; delete photos[id];
    await loadVisits(); panelFor = null; renderAll();
    toast(`${BY_ID[id].name}の記録を消しました`);
  }catch(e){ console.error(e); toast("削除できませんでした", true); }
}

/* 他の端末での更新を拾う：画面に戻ったとき＋2分ごと */
let refreshTimer = null;
function startAutoRefresh(){
  clearInterval(refreshTimer);
  refreshTimer = setInterval(refresh, 120000);
}
async function refresh(){
  if(!code || document.hidden) return;
  try{
    const before = JSON.stringify(Object.fromEntries(Object.entries(visits).map(([k,v])=>[k,v.updatedAt])));
    await loadVisits();
    const after = JSON.stringify(Object.fromEntries(Object.entries(visits).map(([k,v])=>[k,v.updatedAt])));
    if(before !== after){ renderAll(); toast("地図が更新されました"); }
  }catch(e){ console.warn(e); }
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) refresh(); });

(async function init(){
  renderMap(); renderList();
  if(!code){ renderLogin(); setStatus("合言葉を入れると読み込みます"); return; }
  setStatus("読み込み中…");
  try{
    await loadVisits();
    setStatus("保存先: クラウド（同じ合言葉の人には同じ地図が見えます）");
    renderAll(); startAutoRefresh();
  }catch(e){
    if(e.code==="bad_code"){ code=null; try{ localStorage.removeItem("tabi-code"); }catch{} renderLogin("合言葉が変わったようです。もう一度入力してください"); }
    else { renderPanel(); setStatus("つながりませんでした。読み込み直してください"); }
  }
})();
</script>
